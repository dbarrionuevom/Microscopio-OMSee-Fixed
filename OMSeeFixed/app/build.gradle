plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.com.buildwin.omseefixed'
    compileSdk 36

    defaultConfig {
        applicationId "cn.com.buildwin.omseefixed"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0-Fixed"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
}
